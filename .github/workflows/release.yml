name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # The `secrets` context is not available in `if:` conditions, so the two
    # optional credential sets are lifted into the job environment and the
    # steps below gate on `env` instead.
    env:
      CERT_P12_BASE64: ${{ secrets.NOTCHTRAY_CERT_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.NOTCHTRAY_CERT_PASSWORD }}
      NOTCHTRAY_NOTARY_KEY_ID: ${{ secrets.NOTCHTRAY_NOTARY_KEY_ID }}
      NOTCHTRAY_NOTARY_ISSUER_ID: ${{ secrets.NOTCHTRAY_NOTARY_ISSUER_ID }}
      NOTCHTRAY_NOTARY_KEY_P8_BASE64: ${{ secrets.NOTCHTRAY_NOTARY_KEY_P8_BASE64 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.NOTCHTRAY_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          source version.env
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # The tag is the source of truth for what gets published; a version.env
          # that drifted from it would ship a bundle whose Info.plist disagrees
          # with the release name.
          if [[ "$tag" != "v${MARKETING_VERSION}" ]]; then
            echo "error: tag $tag does not match version.env (${MARKETING_VERSION})" >&2
            exit 1
          fi
          echo "version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Developer ID certificate
        if: env.CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/.*"(.*)"/\1/')"
          test -n "$IDENTITY"
          echo "NOTCHTRAY_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and sign DMG
        run: ./Scripts/package_dmg.sh

      - name: Notarize and staple
        env:
          NOTCHTRAY_NOTARY_ENABLED: ${{ env.NOTCHTRAY_NOTARY_KEY_ID != '' }}
        run: ./Scripts/notarize_release.sh

      - name: Build signed Sparkle feed
        if: env.SPARKLE_PRIVATE_KEY != ''
        env:
          NOTCHTRAY_SPARKLE_PRIVATE_KEY: ${{ secrets.NOTCHTRAY_SPARKLE_PRIVATE_KEY }}
          # A tag like v1.2.0-beta.1 publishes on the beta channel; anything
          # else is a stable release.
          NOTCHTRAY_UPDATE_CHANNEL: ${{ contains(steps.version.outputs.tag, '-') && 'beta' || 'stable' }}
        run: ./Scripts/create_sparkle_assets.sh

      - name: Verify artifact
        run: |
          set -euo pipefail
          DMG="dist/NotchTray-${{ steps.version.outputs.version }}.dmg"
          test -f "$DMG"
          hdiutil imageinfo "$DMG" >/dev/null
          codesign --verify --deep --strict dist/NotchTray.app

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG="dist/NotchTray-${VERSION}.dmg"

          # Hand-written notes in release-notes/<version>.md are the release
          # body when present; otherwise fall back to generated commit notes so
          # a release never goes out with an empty description.
          NOTES_FILE="release-notes/${VERSION}.md"
          ARGS=(--title "NotchTray $VERSION")
          if [[ -f "$NOTES_FILE" ]]; then
            {
              cat "$NOTES_FILE"
              printf '\n\n---\n\n'
              printf '**Install:** download `%s`, open it and drag NotchTray into Applications. ' \
                "$(basename "$DMG")"
              printf 'Signed with a Developer ID and notarized by Apple.\n'
            } > "$RUNNER_TEMP/notes.md"
            ARGS+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            ARGS+=(--generate-notes)
          fi

          ASSETS=("$DMG")
          # Sparkle downloads the zip, not the DMG, so it has to be published
          # under the URL baked into the appcast entry.
          ZIP="dist/sparkle/NotchTray-${VERSION}.zip"
          [[ -f "$ZIP" ]] && ASSETS+=("$ZIP")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${ARGS[@]}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ARGS[@]}" "${ASSETS[@]}"
          fi

      - name: Commit the updated appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          # The feed is served from main, so the release is only reachable by
          # existing installs once this lands.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
            exit 0
          fi
          git commit -m "Publish ${{ steps.version.outputs.tag }} to the update feed"
          git push origin main
